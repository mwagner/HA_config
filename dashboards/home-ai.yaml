button_card_templates:
  xmas_switch_button:
    show_state: false
    show_name: false
    show_icon: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    aspect_ratio: 1/1
    custom_fields:
      pic: >-
        [[[ return `<img src="${variables.xmas_image}"
        style="width:45%;height:auto;filter:drop-shadow(0 0 6px
        rgba(255,255,255,0.8));" />`; ]]]
    styles:
      card:
        - border-radius: 18px
        - padding: 8px 4px
        - background: rgba(0, 0, 0, 0.25)
        - backdrop-filter: blur(6px)
        - border: 1px solid rgba(255,255,255,0.25)
        - box-shadow: 0 0 12px rgba(0,0,0,0.6)
      grid:
        - grid-template-areas: '"pic" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto auto auto
        - row-gap: 4px
      custom_fields:
        pic:
          - justify-self: center
          - margin-top: 6px
      name:
        - justify-self: center
        - font-weight: 600
        - font-size: 14px
      state:
        - justify-self: center
        - font-size: 12px
    state:
      - value: 'on'
        styles:
          card:
            - background: >-
                linear-gradient(135deg, rgba(255,76,76,0.95),
                rgba(7,193,96,0.95))
            - box-shadow: 0 0 18px rgba(255,255,255,0.8)
          name:
            - color: '#ffffff'
          state:
            - color: '#ffffff'
      - value: 'off'
        styles:
          card:
            - background: rgba(0,0,0,0.45)
          name:
            - color: '#ffffff'
          state:
            - color: rgba(255,255,255,0.7)
views:
  - title: Home
    sections:
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:gap-card
                visibility:
                  - condition: screen
                    media_query: '(min-width: 767px)'
              - type: custom:gap-card
                visibility:
                  - condition: screen
                    media_query: '(min-width: 767px)'
              - type: custom:mushroom-template-card
                primary: House
                secondary: ''
                icon: mdi:home
                color: |-
                  {% if is_state('input_boolean.home_occupied', 'on') %}
                    blue
                  {% else %}
                    grey
                  {% endif %}
                features_position: bottom
                vertical: true
              - type: custom:mushroom-template-card
                primary: Lights
                secondary: ''
                icon: mdi:lightbulb
                color: |-
                  {% if is_state('light.home_lights', 'on') %}
                    orange
                  {% else %}
                    grey
                  {% endif %}
                tap_action:
                  action: navigate
                  navigation_path: '#lights'
                features_position: bottom
                vertical: true
              - type: custom:mushroom-template-card
                primary: Security
                secondary: ''
                icon: >-
                  {% if is_state('alarm_control_panel.home_alarm_panel',
                  'armed_home') or
                  is_state('alarm_control_panel.home_alarm_panel', 'armed_away')
                  %}
                    mdi:shield-lock
                  {% else %}
                    mdi:shield-lock-open
                  {% endif %}
                color: >-
                  {% if is_state('alarm_control_panel.home_alarm_panel',
                  'armed_home') or
                  is_state('alarm_control_panel.home_alarm_panel', 'armed_away')
                  %}
                    green
                  {% else %}
                    blue
                  {% endif %}
                tap_action:
                  action: navigate
                  navigation_path: security
                features_position: bottom
                vertical: true
              - type: custom:mushroom-template-card
                primary: Network
                secondary: ''
                icon: |-
                  {%- if states('binary_sensor.internet_connection') == "on" -%}
                    mdi:network
                  {% else %}
                    mdi:network-off
