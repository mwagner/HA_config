                    card_mod:
                      style: >
                        ha-card {
                          background: url('/local/images/xmas/background.jpeg') center/100% no-repeat !important;
                          min-height: 217px;
                          border-radius: 22px;
                          overflow: hidden;
                          position: relative;
                          box-shadow: 0 0 18px rgba(0,0,0,0.5);
                          padding: 0; /* ensures clean card edge */

                        ha-card::before {
                          content: "";
                          position: absolute;
                          inset: 0;
                          z-index: 1;
                        }


                        ha-card > * {
                          position: relative;
                          z-index: 1;
                        }


                        /* Desktop 1024px: limit width + center card to avoid BG
                        cropping */

                        @media (min-width: 1024px) {
                          :host {
                            max-width: 550px;
                            margin: 0 auto;
                            display: block;
                          }
                        }
