  - title: Master Bedroom
    path: masterbedroom
    icon: mdi:bed-double
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lights
            heading_style: subtitle
            icon: mdi:lightbulb-group
          - type: custom:stack-in-card
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--ha-card-border-color, var(--divider-color, #e0e0e0));
                }
            cards:
              - type: custom:mushroom-template-card
                primary: All lights in Master Bedroom
                secondary: '{{ states(''light.masterbedroom_lights'') | capitalize }}'
                icon: mdi:lightbulb-group
                entity: light.masterbedroom_lights
                icon_color: |-
                  {% if is_state('light.masterbedroom_lights', 'on') %}
                    orange
                  {% endif %}
                fill_container: false
                multiline_secondary: false
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id: light.masterbedroom_lights
                hold_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target:
                    entity_id: light.masterbedroom_lights
                double_tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border: none !important;
                      box-shadow: none !important;
                    }
              - type: custom:mushroom-light-card
                entity: light.masterbedroom_ceiling_lamp
                name: Ceiling Lamp
                show_brightness_control: true
                show_color_temp_control: true
                collapsible_controls: true
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border: none !important;
                      box-shadow: none !important;
                    }
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:light-entity-card
                    entity: light.marco_s_yeelight
                    title: Marco's Yeelight
                    effects_list: true
                    card_mod:
                      style: |
                        ha-card {
                          background: none !important;
                          border: none !important;
                          box-shadow: none !important;
                        }
                  - type: custom:light-entity-card
                    entity: light.sharene_s_yeelight
                    title: Sharene's Yeelight
                    effects_list: true
                    card_mod:
                      style: |
                        ha-card {
                          background: none !important;
                          border: none !important;
                          box-shadow: none !important;
                        }
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: Climate
            heading_style: subtitle
            icon: mdi:thermometer
          - type: custom:stack-in-card
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--ha-card-border-color, var(--divider-color, #e0e0e0));
                }
            cards:
              - type: custom:mini-graph-card
                name: Temperature & Humidity
                hours_to_show: 24
                points_per_hour: 2
                line_width: 3
                show:
                  extrema: true
                  points: false
                  labels: true
                entities:
                  - entity: sensor.masterbedroom_netatmo_indoor_module_temperature
                    name: Temp
                    color: '#ff8c69'
                  - entity: sensor.masterbedroom_netatmo_indoor_module_humidity
                    name: Humidity
                    color: '#4fc3f7'
                    y_axis: secondary
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border: none !important;
                      box-shadow: none !important;
                    }
              - type: gauge
                entity: sensor.masterbedroom_netatmo_indoor_module_carbon_dioxide
                name: CO2
                unit: ppm
                min: 400
                max: 2000
                severity:
                  green: 400
                  yellow: 800
                  red: 1200
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border: none !important;
                      box-shadow: none !important;
                    }
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: Security
            heading_style: subtitle
            icon: mdi:shield-home
          - type: custom:stack-in-card
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--ha-card-border-color, var(--divider-color, #e0e0e0));
                }
            cards:
              - type: tile
                entity: binary_sensor.masterbedroom_window_sensor_opening
                name: Window
                card_mod:
                  style: |
                    ha-card {
                      background: none !important;
                      border: none !important;
                      box-shadow: none !important;
                    }
          - type: logbook
            hours_to_show: 48
            target:
              entity_id:
                - binary_sensor.masterbedroom_window_sensor_opening
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--ha-card-border-color, var(--divider-color, #e0e0e0));
                }
          - type: heading
            heading: Issues
            heading_style: subtitle
            icon: mdi:alert-circle-outline
            visibility:
              - condition: numeric_state
                entity: sensor.masterbedroom_issues
                above: 0
          - type: custom:stack-in-card
            visibility:
              - condition: numeric_state
                entity: sensor.masterbedroom_issues
                above: 0
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--ha-card-border-color, var(--divider-color, #e0e0e0));
                }
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                card_mod:
                  style: |
                    ha-card { border: 1px solid var(--warning-color); }
                filter:
                  template: >-
                    {% from 'room_issues.jinja' import room_issues %}
                    {% set ns = namespace(cards=[]) %}
                    {% for i in room_issues('masterbedroom') | from_json %}
                      {% set ns.cards = ns.cards + [{
                        'type': 'custom:mushroom-template-card',
                        'entity': i.entity,
                        'primary': state_attr(i.entity, 'friendly_name'),
                        'secondary': i.message,
                        'icon': i.icon,
                        'icon_color': i.color,
                        'card_mod': {'style': 'ha-card { background: none !important; border: none !important; box-shadow: none !important; }'}
                      }] %}
                    {% endfor %}
                    {{ ns.cards }}
        column_span: 1
      - type: grid
        cards:
          - type: markdown
            content: >-
              Placeholder for other devices / sensors, e.g. Lawn Mower in the
              area 'garden' or the oven in 'kitchen'
            visibility:
              - condition: screen
                media_query: '(min-width: 99999px)'
        column_span: 1
    cards: []
    max_columns: 3
    badges:
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: light.masterbedroom_lights
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.masterbedroom_netatmo_indoor_module_temperature
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: binary_sensor.masterbedroom_window_sensor_opening
    show_icon_and_title: true
    subview: true
